# This rule is not used by the project aws-inter-az-traffic-analyzer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the report.k8s.aws.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-inter-az-traffic-analyzer
    app.kubernetes.io/managed-by: kustomize
  name: interaztraffic-editor-role
rules:
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics/status
  verbs:
  - get
