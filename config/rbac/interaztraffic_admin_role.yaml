# This rule is not used by the project aws-inter-az-traffic-analyzer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over report.k8s.aws.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-inter-az-traffic-analyzer
    app.kubernetes.io/managed-by: kustomize
  name: interaztraffic-admin-role
rules:
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics
  verbs:
  - '*'
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics/status
  verbs:
  - get
