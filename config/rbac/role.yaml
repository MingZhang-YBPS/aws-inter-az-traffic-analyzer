---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - '*'
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - '*'
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - '*'
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics/finalizers
  verbs:
  - update
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics/status
  verbs:
  - get
  - patch
  - update
