# This rule is not used by the project aws-inter-az-traffic-analyzer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to report.k8s.aws resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-inter-az-traffic-analyzer
    app.kubernetes.io/managed-by: kustomize
  name: interaztraffic-viewer-role
rules:
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - report.k8s.aws
  resources:
  - interaztraffics/status
  verbs:
  - get
